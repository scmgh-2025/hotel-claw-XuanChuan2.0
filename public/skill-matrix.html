<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotelClaw 技能矩阵</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: rgba(255,255,255,.94);
      --ink: #172033;
      --muted: #7c879b;
      --line: #dce3ee;
      --shadow: 0 10px 30px rgba(32, 53, 91, .08);
      --blue: #4d88ff;
      --green: #42b883;
      --orange: #ee9b4b;
      --purple: #9b7af4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      overflow: hidden;
    }
    button { font: inherit; }
    .page { width: 100%; height: auto; margin: 0; padding: 0; overflow: hidden; }
    .topbar { display: none; }
    .eyebrow { margin: 0 0 6px; color: #71809a; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(22px, 2.2vw, 32px); letter-spacing: -.04em; line-height: 1.1; }
    .intro { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .meta { display: flex; align-items: center; gap: 8px; color: #70809a; font-size: 11px; white-space: nowrap; }
    .meta strong { color: var(--ink); font-size: 15px; }
    .divider { width: 1px; height: 20px; background: #d8dfeb; }
    .diagram-shell { position: relative; height: auto; overflow: hidden; border: none; border-radius: 0; background: transparent; box-shadow: none; }
    .diagram { position: relative; height: auto; padding: 10px 16px 12px; }
    .connector-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .connector { fill: none; stroke: #d4e4f5; stroke-width: 1.35; stroke-linecap: round; opacity: .75; transition: stroke .2s, stroke-width .2s, opacity .2s; filter: url(#glow); }
    .connector.is-active { stroke: #94c5e8; stroke-width: 2.15; opacity: 1; }
    .connector-flow { fill: none; stroke: url(#flowGrad); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 12 40; animation: flowDash 2.2s linear infinite; filter: url(#glowStrong); }
    .connector-flow.is-active { stroke-width: 2.8; animation-duration: 1.4s; }
    @keyframes flowDash { to { stroke-dashoffset: -52; } }
    .levels { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; }
    .root-wrap { display: flex; justify-content: center; }
    .root-node { position: relative; min-width: 220px; padding: 5px 14px 6px; border: 1px solid #dce4f1; border-radius: 12px; background: linear-gradient(135deg, #1f2f4d, #294c7d); color: #fff; text-align: center; box-shadow: 0 0 0 rgba(125,211,252,.5), 0 0 14px rgba(125,211,252,.4), 0 10px 22px rgba(35,67,110,.17); animation: rootGlow 3s ease-in-out infinite; }
    @keyframes rootGlow { 0%, 100% { box-shadow: 0 0 0 rgba(125,211,252,.4), 0 0 12px rgba(125,211,252,.3), 0 10px 22px rgba(35,67,110,.17); } 50% { box-shadow: 0 0 4px rgba(125,211,252,.65), 0 0 28px rgba(110,231,183,.4), 0 10px 22px rgba(35,67,110,.17); } }
    .root-node:before { content: "✦"; display: inline-block; margin-right: 6px; color: #a7c5ff; font-size: 12px; }
    .root-node strong { display: inline-block; font-size: 14px; letter-spacing: -.04em; }
    .root-node span { display: none; }
    .primary-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 0.75fr); gap: 14px; align-items: start; margin-top: 28px; }
    .primary-group { min-width: 0; }
    .primary-node { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative; min-height: 44px; padding: 5px 9px 4px 9px; border: 1px solid var(--tone-line); border-left: 4px solid var(--tone); border-radius: 10px; background: color-mix(in srgb, var(--tone) 8%, white); box-shadow: 0 6px 14px rgba(32,53,91,.07); cursor: pointer; text-align: center; transition: .22s ease; }
    .primary-node:hover, .primary-node.is-active { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(32,53,91,.12); border-color: var(--tone); }
    .primary-node strong { display: block; font-size: 13px; line-height: 1.25; }
    .primary-node em { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-style: normal; }
    .primary-node span { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .secondary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .secondary-wrap { min-width: 0; padding: 7px; border: 1px solid color-mix(in srgb, var(--tone) 28%, white); border-radius: 8px; background: color-mix(in srgb, var(--tone) 7%, white); box-shadow: 0 3px 8px rgba(32,53,91,.03); }
    .secondary-node { display: flex; align-items: center; justify-content: center; min-height: 28px; padding: 5px 6px; border: 1px solid color-mix(in srgb, var(--tone) 46%, white); border-left: 3px solid var(--tone); border-radius: 6px; background: color-mix(in srgb, var(--tone) 15%, white); color: #43516b; font-size: 11px; font-weight: 700; line-height: 1.15; text-align: center; transition: .2s; }
    .secondary-node:hover, .secondary-node.is-active { border-color: var(--tone); background: color-mix(in srgb, var(--tone) 23%, white); box-shadow: 0 5px 12px rgba(32,53,91,.08); transform: translateY(-1px); }
    .feature-grid { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; justify-content: center; margin-top: 5px; }
    .feature-node { display: inline-flex; align-items: center; justify-content: center; width: 88px; height: 30px; padding: 3px 6px; border: 1px solid color-mix(in srgb, var(--tone) 24%, white); border-radius: 6px; background: color-mix(in srgb, var(--tone) 5%, white); color: #68758a; font-size: 10px; line-height: 1.2; text-align: center; transition: .18s ease; }
    .feature-node:hover, .feature-node.is-active { border-color: var(--tone); background: #fff; color: #33415b; box-shadow: 0 3px 8px rgba(32,53,91,.08); transform: translateY(-1px); }
    .feature-node.is-tall { height: 54px; padding: 5px 6px; white-space: normal; line-height: 1.35; }
    .feature-tip { position: fixed; z-index: 9999; max-width: 320px; padding: 12px 14px; border-radius: 10px; background: #1f2937; color: #f9fafb; font-size: 12px; line-height: 1.6; box-shadow: 0 12px 40px rgba(0,0,0,.22); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; }
    .feature-tip.is-visible { opacity: 1; transform: translateY(0); }
    .feature-tip strong { display: block; margin-bottom: 5px; font-size: 13px; color: #fff; }
    .feature-tip:after { content: ""; position: absolute; top: -5px; left: 16px; width: 10px; height: 10px; background: #1f2937; transform: rotate(45deg); }
    .primary-group.is-dimmed { opacity: .25; filter: grayscale(.28); }
    .secondary-node.is-dimmed, .feature-node.is-dimmed { opacity: .25; }
    .source-note { display: none; }
    .primary-group[data-index="3"] .secondary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 1050px) {
      .page { height: auto; overflow: hidden; }
      .diagram-shell { height: auto; overflow: hidden; }
      .diagram { height: auto; padding: 8px 10px; }
      .primary-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .secondary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .primary-group[data-index="3"] .secondary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .connector-layer { display: none; }
    }
    @media (max-width: 620px) {
      .page { padding: 0; }
      .diagram-shell { border-radius: 0; }
      .diagram { padding: 6px; }
      .primary-row { grid-template-columns: 1fr; }
      .secondary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .feature-node { width: 94px; }
      .root-node { min-width: 220px; }
      .root-node strong { font-size: 16px; }
    }
  </style>

      const defs = svg.querySelector('defs'); svg.innerHTML = ''; if (defs) svg.appendChild(defs);
      primaryNodes.forEach((node, i) => {
        const p = point(node, diagram); const yMid = (root.top + p.bottom) / 2;
        const d = `M ${root.x} ${root.top} C ${root.x} ${yMid}, ${p.x} ${yMid}, ${p.x} ${p.bottom}`;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.classList.add('connector'); path.dataset.branch = i;
        path.setAttribute('d', d); svg.appendChild(path);
        const flow = document.createElementNS('http://www.w3.org/2000/svg', 'path'); flow.classList.add('connector-flow'); flow.dataset.branch = i;
        flow.setAttribute('d', d); svg.appendChild(flow);
      });
    }
    drawConnectors();
    new ResizeObserver(drawConnectors).observe(document.getElementById('diagram'));
    window.addEventListener('resize', drawConnectors);
  </script>
</body>
</html>
